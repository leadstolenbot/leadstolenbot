<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рейтинг фандома — прототип</title>
<style>
:root{--page:#d8d8de;--bg:#f2f2f7;--card:#fff;--txt:#000;--sub:#8e8e93;--sep:#e5e5ea;--fill:#e9e9ee;--blue:#007aff;--green:#34c759;--orange:#ff9500;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0b0b0d;--bg:#000;--card:#1c1c1e;--txt:#fff;--sep:#38383a;--fill:#2c2c2e}}
:root[data-theme="dark"]{--page:#0b0b0d;--bg:#000;--card:#1c1c1e;--txt:#fff;--sep:#38383a;--fill:#2c2c2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--page);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:430px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:500px){.app{height:min(860px,100%);margin-top:auto;margin-bottom:auto;border-radius:36px;border:1px solid var(--sep)}body{display:flex}}
.sc{flex:1;overflow-y:auto;padding:12px 16px 16px}
h1{font-size:32px;font-weight:700;letter-spacing:-.6px;margin:8px 0 14px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.lbl{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin:8px 8px 6px}
.hero{display:flex;gap:14px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#5ac8fa,#af52de);display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;flex:none}
.nm{font-weight:600;font-size:17px}.sub{color:var(--sub);font-size:13px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats b{display:block;font-size:24px;letter-spacing:-.5px}.stats span{font-size:12px;color:var(--sub)}
.bar{height:8px;background:var(--fill);border-radius:4px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .5s}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:12px}
.seg div{flex:1;text-align:center;font-size:13px;padding:7px 0;border-radius:7px;font-weight:500;cursor:pointer}
.seg .on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.list{background:var(--card);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative}
.li+.li:before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:500;font-size:16px}.li .t small{color:var(--sub);font-size:12px}
.rk{width:24px;font-weight:700;color:var(--sub);text-align:center}
.mini{width:36px;height:36px;border-radius:50%;flex:none}
.pts{font-weight:600;font-size:15px}.me{background:rgba(0,122,255,.12)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--sep);flex:none;display:grid;place-items:center;color:#fff;font-size:14px;transition:.2s}.ck.d{background:var(--green);border-color:var(--green)}
.task{cursor:pointer}.plus{color:var(--green);font-weight:600;font-size:14px}
.btn{display:block;width:100%;border:0;text-align:center;background:var(--blue);color:#fff;border-radius:14px;padding:15px;font-weight:600;font-size:16px;margin-top:12px;font-family:inherit;cursor:pointer}
.btn:active{opacity:.7}
.ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none}.ico svg{width:22px;height:22px}
.lock{opacity:.55}.tag{font-size:12px;color:var(--blue);font-weight:600}
.tb{display:flex;justify-content:space-around;padding:8px 6px 10px;background:var(--card);border-top:.5px solid var(--sep)}
.tb button{all:unset;cursor:pointer;text-align:center;font-size:10px;color:var(--sub);width:70px;font-weight:500}
.tb svg{display:block;margin:0 auto 2px;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb .on{color:var(--blue)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,-80px);background:var(--card);border:1px solid var(--sep);border-radius:20px;padding:10px 18px;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .35s;z-index:9}
.toast.s{transform:translate(-50%,0)}
.app{position:relative}
.ov{position:absolute;inset:0;background:var(--bg);z-index:5;padding:16px;overflow:auto}.ov[hidden]{display:none}
.oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.oh b{font-size:20px}.oh span{color:var(--blue);cursor:pointer;font-size:16px}
.ov h2{font-size:22px;letter-spacing:-.3px;margin:8px 0 16px}
.opt{background:var(--card);border-radius:14px;padding:15px;margin-bottom:10px;font-size:16px;cursor:pointer}.opt:active{opacity:.6}
canvas{display:block;width:100%;max-width:300px;margin:10px auto;border-radius:18px;background:#0b0b0f;touch-action:none}
.big{text-align:center;font-size:48px;margin:40px 0 8px}.res{text-align:center}
</style>
</head>
<body>
<div class="app"><div class="sc" id="sc"></div><nav class="tb" id="tb"></nav><div class="ov" id="ov" hidden></div></div>
<div class="toast" id="ts"></div>
<script>
var IC=[
'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.6 18.2c1.4-2.2 3.2-3.2 5.4-3.2s4 1 5.4 3.2"/>',
'<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.5A3 3 0 0 0 8 10.5M16 6h3v1.5a3 3 0 0 1-3 3"/><path d="M12 13v4M9 20h6M10 17h4"/>',
'<circle cx="12" cy="12" r="9"/><path d="m8 12.4 2.7 2.7L16 9.6"/>',
'<rect x="4" y="9" width="16" height="11" rx="2"/><path d="M3 9h18v3H3zM12 9v11"/><path d="M12 9C10.5 9 8 8.4 8 6.6S10.6 4.6 12 9c1.4-4.4 4-2.4 4-.4S13.500 9 12 9z"/>'];
var TN=["Профиль","Топ","Задания","Награды"];
var U=[["night_kai",980,2410,0],["nine_lives",910,2180,0],["angel_wave",870,1950,1],["dvor_zvuk",760,1720,0],["lil_sonic",700,1605,0],["ghost_beat",655,1400,1],["flow_mice",620,1300,0],["kai_lover",560,1255,1]];
var ME={n:"mouse_fan",w:640,a:1240};
var LV=[[0,"Новичок"],[500,"Слушатель"],[1000,"Фанат"],[1500,"Ветеран"],[3000,"Легенда"]];
var K=[["Зайти в приложение","Серия 7 дней",1,1],["Пройти квиз дня","3 вопроса · нужно 2 верных",20,0,"quiz"],["Сыграть в Pong","5 раундов · проигрыш −5",20,0,"pong","+20 / −5"],["Поделиться карточкой","В сторис",10,0],["Подписаться на @leadstolen","Разово",20,0,"chan"],["Пригласить друга","Приглашено 3",30,0,"gen"]];
var tab=0,per=0;
function g(n){var h=0;for(var i=0;i<n.length;i++)h+=n.charCodeAt(i)*7;return"linear-gradient(135deg,hsl("+h%360+",80%,60%),hsl("+(h+70)%360+",70%,55%))"}
function fmt(x){return String(x).replace(/\B(?=(\d{3})+(?!\d))/g,"\u00a0")}
function board(p){var a=U.filter(function(u){return p==2?u[3]:1}).map(function(u){return{n:u[0],v:p==1?u[2]:u[1]}});a.push({n:ME.n,v:p==1?ME.a:ME.w,me:1});return a.sort(function(x,y){return y.v-x.v})}
function lvl(){var i=0;LV.forEach(function(l,j){if(ME.a>=l[0])i=j});return i}
function view(){
var h="";
if(tab==0){var i=lvl(),nx=LV[i+1],pc=nx?Math.round((ME.a-LV[i][0])/(nx[0]-LV[i][0])*100):100,r=board(1).findIndex(function(x){return x.me})+1;
h='<h1>Профиль</h1><div class="card hero"><div class="av">M</div><div><div class="nm">@'+ME.n+'</div><div class="sub">'+LV[i][1]+' · уровень '+(i+1)+'</div></div></div><div class="card stats"><div><b>'+fmt(ME.a)+'</b><span>очков</span></div><div><b>#'+r+'</b><span>в топе</span></div><div><b>7</b><span>дней подряд</span></div></div><div class="card"><div style="display:flex;justify-content:space-between;font-size:14px"><span>'+(nx?'До «'+nx[1]+'»':'Максимум')+'</span><b>'+(nx?fmt(nx[0]-ME.a):'')+'</b></div><div class="bar"><i style="width:'+pc+'%"></i></div><div class="sub">Выполняйте задания, чтобы расти</div></div>'}
if(tab==1){h='<h1>Топ фанатов</h1><div class="seg">'+["Неделя","Всё время","Друзья"].map(function(s,i){return'<div class="'+(i==per?"on":"")+'" onclick="per='+i+';draw()">'+s+'</div>'}).join("")+'</div><div class="list">'+board(per).map(function(x,i){return'<div class="li'+(x.me?" me":"")+'"><span class="rk">'+(i<3?["🥇","🥈","🥉"][i]:i+1)+'</span><div class="mini" style="background:'+g(x.n)+'"></div><div class="t"><b>'+(x.me?"Вы":"@"+x.n)+'</b>'+(x.me?'<small>@'+x.n+'</small>':'')+'</div><span class="pts">'+fmt(x.v)+'</span></div>'}).join("")+'</div>'}
if(tab==2){function row(k,i){return'<div class="li task" onclick="act('+i+')"><span class="ck'+(k[3]?" d":"")+'">'+(k[3]?"✓":"")+'</span><div class="t"><b>'+k[0]+'</b><small>'+(k[6]&&!k[3]&&k[4]=="chan"?"Нажмите ещё раз — проверим подписку":k[1])+'</small></div><span class="plus">'+(k[5]||"+"+k[2])+'</span></div>'}
h='<h1>Задания</h1><div class="lbl">Сегодня</div><div class="list">'+[0,1,2,3].map(function(i){return row(K[i],i)}).join("")+'</div><div class="lbl" style="margin-top:14px">Разовые</div><div class="list">'+[4,5].map(function(i){return row(K[i],i)}).join("")+'</div><button class="btn" onclick="toast(\'Ссылка-приглашение скопирована\')">Пригласить друга</button>'}
if(tab==3){var t3=870,gap=Math.max(0,t3+1-ME.w);
h='<h1>Награды</h1><div class="card"><div class="nm" style="font-size:15px">Топ-3 недели</div><div class="sub">'+(gap?'Ещё '+gap+' очков до бронзы':'Вы в тройке недели!')+'</div><div class="bar"><i style="width:'+Math.min(100,Math.round(ME.w/(t3+1)*100))+'%;background:var(--orange)"></i></div></div><div class="list">'+
[["#007aff","Эксклюзивный шаблон","Для топ-3 недели",'<rect x="4" y="5" width="16" height="14" rx="3"/><circle cx="9" cy="10" r="1.500"/><path d="m5 17 5-4 3 2.500 2-2 4 3.500"/>'],["#af52de","Тег в чате фандома","Уровень «Ветеран»",'<path d="M4 12.500V5h7.500l8 8-7.500 7.500z"/><circle cx="8.500" cy="9" r="1"/>'],["#ff9500","Розыгрыш мерча","Топ-3 месяца",'<rect x="4" y="9" width="16" height="11" rx="2"/><path d="M3 9h18v3H3zM12 9v11"/>'],["#34c759","Пост о вас в канале","Победитель недели",'<path d="M4 10v4h3l7 4V6L7 10z"/><path d="M17.500 9.500a4 4 0 0 1 0 5"/>']].map(function(r,i){return'<div class="li'+(i&&!(i==0&&!gap)?" lock":"")+'"><div class="ico" style="background:'+r[0]+'26;color:'+r[0]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round">'+r[3]+'</svg></div><div class="t"><b>'+r[1]+'</b><small>'+r[2]+'</small></div><span class="'+(i?"":"tag")+'">'+(i?"🔒":gap?"Скоро":"Открыто")+'</span></div>'}).join("")+'</div>'}
return h}
function draw(){document.getElementById("sc").innerHTML=view();document.getElementById("tb").innerHTML=TN.map(function(n,i){return'<button class="'+(i==tab?"on":"")+'" onclick="tab='+i+';draw()"><svg viewBox="0 0 24 24">'+IC[i]+'</svg>'+n+'</button>'}).join("")}
function add(p){ME.a=Math.max(0,ME.a+p);ME.w=Math.max(0,ME.w+p)}
function act(i){var k=K[i];if(k[3])return;
if(k[4]=="quiz"){if(k[6])return toast("Квиз — раз в день");return quiz()}
if(k[4]=="pong")return pong();
if(k[4]=="chan"&&!k[6]){k[6]=1;window.open("https://t.me/leadstolen","_blank");toast("Подпишитесь и вернитесь");return draw()}
if(k[4]=="gen")return toast("Ссылка-приглашение скопирована");
k[3]=1;add(k[2]);toast("+"+k[2]+" очков");draw()}
function ov(h){var o=document.getElementById("ov");o.innerHTML=h;o.hidden=false}
function cl(){stop();document.getElementById("ov").hidden=true;draw()}
var Q=[["Пример вопроса 1 — замените на свой",["Вариант A","Вариант B","Вариант C"],0],["Пример вопроса 2 — замените на свой",["Вариант A","Вариант B","Вариант C"],1],["Пример вопроса 3 — замените на свой",["Вариант A","Вариант B","Вариант C"],2]],qi,qs;
function quiz(){qi=0;qs=0;qn()}
function qn(){var q=Q[qi];ov('<div class="oh"><b>Квиз дня</b><span onclick="cl()">Закрыть</span></div><div class="sub">Вопрос '+(qi+1)+' из '+Q.length+'</div><h2>'+q[0]+'</h2>'+q[1].map(function(o,i){return'<div class="opt" onclick="qa('+i+')">'+o+'</div>'}).join(""))}
function qa(i){if(i==Q[qi][2])qs++;qi++;if(qi<Q.length)return qn();var ok=qs>=2,k=K[1];k[6]=1;if(ok){k[3]=1;add(k[2])}
ov('<div class="res"><div class="big">'+(ok?"🎉":"😕")+'</div><h2>'+(ok?"Квиз пройден: +20":"Не хватило верных ответов")+'</h2><div class="sub">Верно: '+qs+' из '+Q.length+'</div><button class="btn" onclick="cl()">Готово</button></div>')}
var P={left:3},raf,G;
function stop(){cancelAnimationFrame(raf);G=null}
function fin(w){stop();add(w?20:-5);ov('<div class="res"><div class="big">'+(w?"🏆":"💥")+'</div><h2>'+(w?"Все 5 раундов: +20":"Проигрыш: −5 очков")+'</h2><div class="sub">Попыток сегодня осталось: '+P.left+'</div><button class="btn" onclick="cl()">Готово</button></div>')}
function pong(){if(P.left<1)return toast("Лимит: 3 игры в день");P.left--;stop();
ov('<div class="oh"><b>Pong</b><span onclick="cl()">Выйти</span></div><div class="sub" id="pr"></div><canvas id="cv" width="300" height="420"></canvas><div class="sub" style="text-align:center">Ведите пальцем или мышью. Нужно выиграть все 5 раундов</div>');
var c=document.getElementById("cv"),x=c.getContext("2d");G={px:120,bx:150,by:210,vx:0,vy:0,bt:120,r:1};
function serve(){G.bx=150;G.by=210;var s=2.8+G.r*.3;G.vx=(Math.random()<.5?-1:1)*s*.6;G.vy=s;document.getElementById("pr").textContent="Раунд "+G.r+" из 5 · попыток осталось: "+P.left}
c.onpointerdown=c.onpointermove=function(e){if(!G)return;var b=c.getBoundingClientRect();G.px=Math.max(0,Math.min(240,(e.clientX-b.left)*300/b.width-30))};
serve();var last=performance.now();
function f(t){if(!G)return;var d=Math.min(2,(t-last)/16.67);last=t;
G.bx+=G.vx*d;G.by+=G.vy*d;
if(G.bx<6||G.bx>294){G.vx*=-1;G.bx=Math.max(6,Math.min(294,G.bx))}
G.bt+=Math.max(-2.3*d,Math.min(2.3*d,G.bx-G.bt-30));G.bt=Math.max(0,Math.min(240,G.bt));
if(G.vy>0&&G.by>=394&&G.by<=414&&G.bx>=G.px-4&&G.bx<=G.px+64){G.vy=-Math.abs(G.vy)*1.05;G.vx=Math.max(-7,Math.min(7,G.vx+(G.bx-G.px-30)/30*2.2))}
if(G.vy<0&&G.by<=26&&G.by>=6&&G.bx>=G.bt-4&&G.bx<=G.bt+64)G.vy=Math.abs(G.vy)*1.02;
if(G.by>430)return fin(0);
if(G.by<-10){if(G.r==5)return fin(1);G.r++;serve()}
x.fillStyle="#0b0b0f";x.fillRect(0,0,300,420);x.strokeStyle="#333";x.setLineDash([6,8]);x.beginPath();x.moveTo(0,210);x.lineTo(300,210);x.stroke();
x.fillStyle="#fff";x.fillRect(G.px,400,60,8);x.fillRect(G.bt,12,60,8);x.fillStyle="#0a84ff";x.beginPath();x.arc(G.bx,G.by,6,0,7);x.fill();
raf=requestAnimationFrame(f)}
raf=requestAnimationFrame(f)}
var tm;function toast(s){var t=document.getElementById("ts");t.textContent=s;t.classList.add("s");clearTimeout(tm);tm=setTimeout(function(){t.classList.remove("s")},1600)}
draw();
</script>
</body>
</html>
